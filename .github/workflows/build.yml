name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libvulkan-dev vulkan-tools glslang-tools \
            libx264-dev mesa-vulkan-drivers
      - name: build
        run: make
      - name: cpu tests
        run: make test
      - name: vulkan tests (lavapipe)
        run: make test-vk
      - name: package
        run: sh scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mathgfx-linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make
            diffutils
            zip
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-python
      - name: build
        run: make
      - name: cpu tests
        run: make test
      - name: package
        run: sh scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mathgfx-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect and checksum
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          name: MathGFX ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
